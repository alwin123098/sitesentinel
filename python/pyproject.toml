[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesentinel-security"
version = "0.1.0"
description = "Bounded request inspection for Python WSGI and ASGI applications"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "../LICENSE"}
classifiers = ["Development Status :: 3 - Alpha", "Framework :: WSGI", "Framework :: AsyncIO", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]

[tool.setuptools]
packages = ["sitesentinel"]
